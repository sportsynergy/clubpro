services:
  db:
    platform: linux/amd64
    image: mysql:8.0.42-debian
    container_name: clubpro-db
    command: --default-authentication-plugin=mysql_native_password
    restart: no
    ports:
     - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CLUBPRO_DB_PASS}
      MYSQL_DATABASE: clubpro_main
    volumes:
      - data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/localhost.crt:/etc/ssl/localhost.crt:ro
      - ./config/localhost.key:/etc/ssl/localhost.key:ro
    depends_on:
      - app

  app:
    container_name: clubpro-web
    build: .
    restart: unless-stopped
    volumes:
    - .:/var/www/html/clubpro
    depends_on:
      - db
    # Internal port your app listens on (do not expose to the host)
    expose:
      - "8000" 
    environment:
      - CLUBPRO_DB_USER=${CLUBPRO_DB_USER}
      - CLUBPRO_DB_PASS=${CLUBPRO_DB_PASS}
      - CLUBPRO_DB_NAME=${CLUBPRO_DB_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

volumes:
  data:
