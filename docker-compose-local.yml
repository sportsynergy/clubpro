services:
  db:
    platform: linux/amd64
    image: mysql:8.0.42-debian
    container_name: clubpro-db
    command: --default-authentication-plugin=mysql_native_password
    restart: no
    ports:
     - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CLUBPRO_DB_PASS}
      MYSQL_DATABASE: clubpro_main
    volumes:
      - data:/var/lib/mysql

  app:
    container_name: clubpro-web
    build: .
    restart: unless-stopped
    volumes:
    - .:/var/www/html/clubpro
    depends_on:
      - db
    # Internal port your app listens on (do not expose to the host)
    expose:
      - "8000" 
    ports:
      - "8000:8000"

volumes:
  data:
