server {
    listen 80;
    listen [::]:80;
    server_name poems.sportsynergy.net ://poems.sportsynergy.net;
location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poems.sportsynergy.net ://poems.sportsynergy.net;
# SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/://poems.sportsynergy.net;
    ssl_certificate_key /etc/letsencrypt/live/://poems.sportsynergy.net;
# Optimized Production SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
# Proxy traffic to your internal application container
    location / {
        proxy_pass http://app:8000; # Matches service name and internal port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
