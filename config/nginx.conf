server {
    listen 80;
    listen [::]:80;
    server_name poems.sportsynergy.net;
location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poems.sportsynergy.net;
# SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/poems.sportsynergy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poems.sportsynergy.net/privkey.pem;
# Optimized Production SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
# Proxy traffic to your internal application container
location /clubpro/ {
        proxy_pass http://app:8000/;


	# Catch 404s returned by the app
        proxy_intercept_errors on;
        error_page 404 https://sportsynergy.net;

	proxy_redirect ~^https?://[^/]+/(.*)$ /clubpro/$1;
        proxy_redirect / /clubpro/;
	proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /clubpro;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }


}