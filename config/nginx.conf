server {
    listen 80;
    listen [::]:80;
    server_name www.sportsynergy.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sportsynergy.net;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/www.sportsynergy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sportsynergy.net/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "HIGH:!aNULL:!MD5";

    # Redirect bare /clubpro to /clubpro/
    location = /clubpro {
        return 301 /clubpro/;
    }

    # Proxy everything under /clubpro/ to the PHP app
    location /clubpro/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /clubpro;

        # Optional but usually helpful for frameworks behind a subpath
        proxy_redirect off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Optional: if someone visits root, send them to /clubpro/
    location / {
        return 301 https://$host/clubpro/;
    }
}