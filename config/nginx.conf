# Put this at the http level (it's fine at the top of the same conf.d file,
# outside any server block). IPs that bypass maintenance mode:
geo $maint_bypass {
    default          0;
    123.45.67.89     1;   # replace with your public IP
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sportsynergy.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sportsynergy.net;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/www.sportsynergy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sportsynergy.net/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "HIGH:!aNULL:!MD5";
   
    # ---- Maintenance mode ----
    set $maint "";
    if (-f /opt/clubpro.maintenance) { set $maint "on"; }
    if ($maint_bypass = 1)                          { set $maint ""; }
    if ($uri = /maintenance.html)                   { set $maint ""; }
    if ($maint = "on")                              { return 503; }

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /var/www/html/;
        internal;
        add_header Retry-After 1800 always;
        add_header Cache-Control "no-store" always;
    }
    # ---- end maintenance mode ----

    # Root only: send to the main site
    location = / {
        return 302 https://sportsynergy.net;
    }

    # Send 404s (from nginx or the app) to the main site
    error_page 404 =302 /clubpro/404.html;

    # Proxy everything under / to the PHP app
    location / {
        proxy_pass http://app:8000;
        proxy_intercept_errors on;
	    proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Optional but usually helpful for frameworks behind a subpath
	    proxy_redirect off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

}
    
