server {
    listen 80;
    listen [::]:80;
    server_name www.sportsynergy.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sportsynergy.net;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/www.sportsynergy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sportsynergy.net/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "HIGH:!aNULL:!MD5";
    
    # Root only: send to the main site
    location = / {
        return 302 https://sportsynergy.net;
    }

    # Send 404s (from nginx or the app) to the main site
    error_page 404 =302 /clubpro/404.html;

    # Proxy everything under / to the PHP app
    location / {
        proxy_pass http://app:8000;
        proxy_intercept_errors on;
	    proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Optional but usually helpful for frameworks behind a subpath
	    proxy_redirect off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

 \
}
