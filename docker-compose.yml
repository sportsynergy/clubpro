services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    # This command checks if certificates need renewal every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  
  db:
    platform: linux/amd64
    image: mysql:8.0.42-debian
    container_name: clubpro-db
    command: --default-authentication-plugin=mysql_native_password
    restart: no
    ports:
     - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CLUBPRO_DB_PASS}
      MYSQL_DATABASE: clubpro_main
    volumes:
      - data:/var/lib/mysql

  app:
    container_name: clubpro-web
    build: .
    restart: unless-stopped
    volumes:
    - .:/var/www/html
    depends_on:
      - db
    # Internal port your app listens on (do not expose to the host)
    expose:
      - "8000" 

volumes:
  data:
  certbot-etc:
  certbot-var:
