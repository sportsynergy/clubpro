services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
      - ./maintenance.html:/var/www/html/maintenance.html:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    # This command checks if certificates need renewal every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  
  db:
    platform: linux/amd64
    image: mysql:8.0.42-debian
    container_name: clubpro-db
    command: --default-authentication-plugin=mysql_native_password
    restart: no
    ports:
     - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CLUBPRO_DB_PASS}
      MYSQL_DATABASE: ${CLUBPRO_DB_NAME}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - data:/var/lib/mysql

  app:
    container_name: clubpro-web
    build: .
    restart: unless-stopped
    volumes:
    - .:/var/www/html/clubpro
    depends_on:
      - db
    environment:
      - CLUBPRO_DB_USER=${CLUBPRO_DB_USER}
      - CLUBPRO_DB_PASS=${CLUBPRO_DB_PASS}
      - CLUBPRO_DB_NAME=${CLUBPRO_DB_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 
volumes:
  data:
  certbot-etc:
  certbot-var:
